<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ระบบจัดการอะไหล่ (Spare Part Management)</title>
<style>
:root{
  --bg:#f5f6f8; --card:#ffffff; --text:#1a1d21; --muted:#6b7280;
  --border:#e3e6ea; --accent:#2563eb; --accent-fg:#ffffff;
  --danger:#dc2626; --danger-bg:#fee2e2; --ok:#059669; --ok-bg:#d1fae5;
  --warn:#d97706; --warn-bg:#fef3c7;
  --danger-dark:#7f1d1d; --danger-dark-bg:#fecaca;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111317; --card:#1a1d21; --text:#e8e9eb; --muted:#9aa1ab;
    --border:#2a2d33; --danger-bg:#3a1414; --ok-bg:#0f2c22; --warn-bg:#3a2a0c;
    --danger-dark:#ff4d4d; --danger-dark-bg:#4a1010;
  }
}
:root[data-theme="dark"]{
  --bg:#111317; --card:#1a1d21; --text:#e8e9eb; --muted:#9aa1ab;
  --border:#2a2d33; --danger-bg:#3a1414; --ok-bg:#0f2c22; --warn-bg:#3a2a0c;
  --danger-dark:#ff4d4d; --danger-dark-bg:#4a1010;
}
html{scroll-padding-top: env(safe-area-inset-top, 0px); height:100%;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,'Noto Sans Thai',sans-serif;height:100%;}
.userbox{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);}
.userbox .who{color:var(--text);font-weight:600;}
.userbox .dept{background:var(--bg);border:1px solid var(--border);padding:2px 8px;border-radius:10px;font-size:11px;}
.logout{border:1px solid var(--border);background:var(--bg);color:var(--text);padding:5px 10px;border-radius:8px;font-size:12px;cursor:pointer;}
.lang-toggle{border:1px solid var(--border);background:var(--bg);color:var(--accent);padding:5px 10px;border-radius:8px;font-size:12px;cursor:pointer;font-weight:600;}
.layout{display:flex;min-height:100vh;align-items:stretch;}
.sidebar{width:220px;flex-shrink:0;position:sticky;top:0;height:100vh;align-self:flex-start;padding-top:env(safe-area-inset-top,0px);}
.sidebar-inner{display:flex;flex-direction:column;height:100%;width:220px;background:var(--card);border-right:1px solid var(--border);}
.sidebar-brand{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:16px 14px;font-weight:700;font-size:15px;border-bottom:1px solid var(--border);white-space:nowrap;overflow:hidden;}
.sidebar-brand-left{display:flex;align-items:center;gap:8px;overflow:hidden;}
.brand-stack{display:flex;flex-direction:column;line-height:1.25;min-width:0;}
.brand-sub{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:2px;}
.sidebar-nav{display:flex;flex-direction:column;gap:2px;padding:10px;flex:1;overflow-y:auto;overflow-x:hidden;}
.sidebar-nav button{display:flex;align-items:center;gap:10px;border:none;background:transparent;color:var(--text);padding:10px 12px;border-radius:8px;font-size:13px;cursor:pointer;text-align:left;white-space:nowrap;overflow:hidden;width:100%;}
.sidebar-nav button.active{background:var(--accent);color:var(--accent-fg);}
.sidebar-nav button:hover:not(.active){background:var(--bg);}
.nav-icon{font-size:16px;flex-shrink:0;}
.main-area{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--border);padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;z-index:10;}
.topbar-title{font-size:16px;font-weight:700;}
main{max-width:900px;margin:0 auto;padding:16px;width:100%;}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px;}
.card h2{margin:0 0 12px;font-size:15px;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;}
.stat{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px;}
.stat .icon{font-size:18px;margin-bottom:4px;}
.stat .n{font-size:22px;font-weight:700;}
.stat .l{font-size:12px;color:var(--muted);}
table{width:100%;border-collapse:collapse;font-size:13px;}
.tbl-wrap{overflow-x:auto;overflow-y:visible;}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--border);white-space:nowrap;}
th{color:var(--muted);font-weight:600;font-size:12px;}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;}
.badge.low{background:var(--warn-bg);color:var(--warn);}
.badge.ok{background:var(--ok-bg);color:var(--ok);}
.badge.out{background:var(--danger-dark-bg);color:var(--danger-dark);animation:blink 1s step-start infinite;}
@keyframes blink{50%{opacity:.35;}}
.field-hint{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.5;}
/* ตรึงหัวตารางไว้เมื่อเลื่อนลง: ให้ตารางเลื่อนแยกในกรอบของตัวเอง แล้ว thead จะบังอยู่บนสุด */
#partsTableWrap,#historyCard .tbl-wrap{max-height:calc(100vh - 170px);overflow:auto;}
#partsTableWrap thead th,#historyCard thead th{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:none;box-shadow:inset 0 -1px 0 var(--border);}
.brand-icon{display:flex;align-items:center;justify-content:center;}
.brand-logo{width:30px;height:30px;object-fit:contain;border-radius:6px;display:block;}
.logo-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.logo-preview{width:56px;height:56px;border:1px dashed var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:28px;background:var(--bg);overflow:hidden;}
.logo-preview img{width:100%;height:100%;object-fit:contain;}
.kind-group{display:flex;gap:8px;flex-wrap:wrap;}
.kind-opt{display:inline-flex;align-items:center;gap:6px;margin:0;padding:8px 16px;border:1px solid var(--border);border-radius:8px;font-size:13px;color:var(--text);cursor:pointer;background:var(--bg);}
.kind-opt input{width:auto;margin:0;}
.kind-opt:has(input:checked){border-color:var(--accent);color:var(--accent);font-weight:600;}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;padding-bottom:12px;border-bottom:1px solid var(--border);}
.subtab{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);padding:6px 12px;border-radius:16px;font-size:13px;cursor:pointer;}
.subtab:hover:not(.active){background:var(--card);}
.subtab.active{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);}
.subtab-n{font-size:11px;opacity:.75;}
.col-toggle{border:1px solid var(--border);background:var(--bg);color:var(--accent);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;}
th.col-collapsed,td.col-collapsed{width:34px;min-width:34px;padding:8px 2px;text-align:center;}
.qty-num{font-weight:600;}
.badge.owner{background:var(--bg);color:var(--accent);border:1px solid var(--border);}
.part-thumb{width:38px;height:38px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;cursor:zoom-in;transition:transform .25s ease, box-shadow .25s ease;transform-origin:center;}
.part-thumb-img{object-fit:cover;background:var(--bg);border:1px solid var(--border);}
.part-row{cursor:pointer;}
.part-row:hover td{background:var(--bg);}
.detail-body{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start;}
.detail-img{width:200px;height:200px;object-fit:contain;border:1px solid var(--border);border-radius:12px;background:var(--bg);flex-shrink:0;}
.detail-letter{display:flex;align-items:center;justify-content:center;color:#fff;font-size:72px;font-weight:700;border:none;}
.detail-grid{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:13px;flex:1;min-width:220px;align-content:start;}
.detail-grid .k{color:var(--muted);}
.detail-grid .v{font-weight:500;word-break:break-word;}
.part-thumb:hover{transform:scale(2.6);box-shadow:0 10px 24px rgba(0,0,0,.35);position:relative;z-index:20;}
form{display:grid;gap:10px;grid-template-columns:1fr 1fr;}
form .full{grid-column:1/-1;}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;}
button.submit{grid-column:1/-1;background:var(--accent);color:var(--accent-fg);border:none;padding:10px;border-radius:8px;font-size:14px;cursor:pointer;font-weight:600;}
.msg{grid-column:1/-1;font-size:13px;padding:8px 10px;border-radius:8px;display:none;}
.msg.show{display:block;}
.msg.err{background:var(--danger-bg);color:var(--danger);}
.msg.ok{background:var(--ok-bg);color:var(--ok);}
.hidden{display:none !important;}
.tag-in{color:var(--ok);} .tag-out{color:var(--danger);}
.empty{color:var(--muted);font-size:13px;padding:8px 0;}
/* chart */
.chart-row{display:flex;gap:20px;flex-wrap:wrap;align-items:center;}
.donut{width:140px;height:140px;border-radius:50%;flex-shrink:0;}
.legend{display:flex;flex-direction:column;gap:8px;font-size:13px;}
.legend .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;}
.bar-item{margin-bottom:10px;}
.bar-item .bh{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px;color:var(--muted);}
.bar-track{position:relative;height:14px;background:var(--bg);border:1px solid var(--border);border-radius:7px;overflow:hidden;}
.bar-fill{height:100%;border-radius:7px 0 0 7px;}
/* alerts */
.alert-card{border:1px solid var(--border);border-left:4px solid var(--warn);border-radius:8px;padding:10px 12px;margin-bottom:10px;background:var(--warn-bg);}
.alert-card.out{border-left-color:var(--danger-dark);background:var(--danger-dark-bg);animation:blink 1s step-start infinite;}
.alert-card .row1{display:flex;justify-content:space-between;font-weight:700;font-size:13px;}
.alert-card .details{font-size:12px;color:var(--text);opacity:.85;margin-top:4px;display:flex;gap:10px;flex-wrap:wrap;}
/* login */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;}
.modal-overlay.hidden{display:none;}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;max-width:420px;width:100%;max-height:90vh;overflow-y:auto;}
.modal-box h2{margin:0 0 14px;font-size:16px;}
.modal-box form{grid-template-columns:1fr 1fr;}
.pin-btn{border:none;background:transparent;font-size:16px;cursor:pointer;padding:2px;}
.login-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:28px 24px;max-width:360px;width:100%;position:relative;}
.login-card h1{font-size:18px;margin:0 0 4px;text-align:center;}
.login-card p{font-size:12px;color:var(--muted);text-align:center;margin:0 0 18px;}
.login-card form{grid-template-columns:1fr;}
.login-lang-row{display:flex;justify-content:flex-end;margin-bottom:10px;}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ======== ตั้งค่า API / API config ========
// วาง URL ของ Google Apps Script Web App ที่ Deploy แล้ว (ลงท้ายด้วย /exec) ตรงนี้
const API_URL = "https://script.google.com/macros/s/AKfycbxTVMnJTpMgwp4L-Oa2ooJE3DNPhI0WfpK3VPvmOeXEzftTCRCQFebnC7kIguoCaMwN/exec";

// ======== DEMO_MODE ========
// true  = ใช้ข้อมูลจำลองในหน้าเว็บ (สำหรับ Published Artifact ที่เรียก Apps Script โดยตรงไม่ได้)
// false = เรียก Google Apps Script จริงผ่าน API_URL (ใช้ตอนนำไปวางบน GitHub Pages)
const DEMO_MODE = false;

function callApi(action, payload){
  if(DEMO_MODE) return mockApi(action, payload || {});
  return fetch(API_URL, {
    method: 'POST',
    headers: {'Content-Type': 'text/plain;charset=utf-8'}, // text/plain หลีกเลี่ยง CORS preflight
    body: JSON.stringify({action, payload: payload || {}}),
  }).then(r=>{
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  });
}

// ---- Mock backend (ทำงานเหมือน Code.gs แต่เก็บข้อมูลในหน้าเว็บ) ----
const _day = 86400000;
function _ago(d){ return new Date(Date.now() - d*_day).toISOString(); }
const MOCK = {
  users: [
    {u:'admin', p:'1234', n:'ผู้ดูแลระบบ', d:'Admin'},
    {u:'me01', p:'1234', n:'ช่างซ่อมบำรุง (ME)', d:'ME'},
    {u:'mfg01', p:'1234', n:'เจ้าหน้าที่ผลิต (MFG)', d:'MFG'},
    {u:'pe01', p:'1234', n:'วิศวกรกระบวนการ (PE)', d:'PE'},
  ],
  parts: [
    ['SP-001','สายพานลำเลียง 10mm','General','MFG',12,5,'เส้น',''],
    ['SP-002','ตลับลูกปืน 6205','General','ME',3,10,'ชิ้น',''],
    ['SP-003','ฟิลเตอร์ลมอัด','Consumable','PE',0,4,'ชิ้น',''],
    ['SP-004','มอเตอร์ไฟฟ้า 1HP','General','ME',6,2,'ตัว',''],
    ['SP-005','ซีลยางปั๊ม','Consumable','PE',25,10,'ชิ้น',''],
    ['SP-006','โซลินอยด์วาล์ว 24V','General','MFG',2,3,'ตัว',''],
    ['SP-007','ถุงมือยางกันสารเคมี','PPE','PE',40,20,'คู่',''],
    ['SP-008','ปากกามาร์กเกอร์','Stationary','MFG',8,10,'ด้าม',''],
    ['SP-009,SP-109','ซีลกันน้ำมัน (2 เบอร์ทดแทนกัน)','Consumable','ME',14,6,'ชิ้น',''],
  ].map(r=>({code:r[0],name:r[1],category:r[2],owner:r[3],stock:r[4],min:r[5],unit:r[6],image:r[7]})),
  history: [
    [_ago(12),'เบิกออก','SP-002','ตลับลูกปืน 6205',4,'ช่างซ่อมบำรุง (ME)','เปลี่ยนลูกปืนมอเตอร์ไลน์ 1'],
    [_ago(9),'เติมเข้า','SP-005','ซีลยางปั๊ม',20,'ผู้ดูแลระบบ','PO-2026-0801'],
    [_ago(6),'เบิกออก','SP-003','ฟิลเตอร์ลมอัด',4,'วิศวกรกระบวนการ (PE)','เปลี่ยนไส้กรองประจำสัปดาห์'],
    [_ago(4),'เบิกออก','SP-001','สายพานลำเลียง 10mm',3,'เจ้าหน้าที่ผลิต (MFG)','ซ่อมสายพานไลน์ 2'],
    [_ago(3),'เติมเข้า','SP-004','มอเตอร์ไฟฟ้า 1HP',2,'ผู้ดูแลระบบ','PO-2026-0815'],
    [_ago(2),'คืน','SP-007','ถุงมือยางกันสารเคมี',5,'เจ้าหน้าที่ผลิต (MFG)','คืนของเหลือจากงานซ่อม'],
    [_ago(1),'เบิกออก','SP-002','ตลับลูกปืน 6205',3,'ช่างซ่อมบำรุง (ME)','เปลี่ยนลูกปืนปั๊ม'],
  ].map(r=>({'วันที่':r[0],'ประเภท':r[1],'รหัส':r[2],'ชื่ออะไหล่':r[3],'จำนวน':r[4],'โดย':r[5],'หมายเหตุ':r[6]})),
  logins: [],
};
function _partRow(p){
  return {'รหัส':p.code,'ชื่อ':p.name,'หมวดหมู่':p.category,'เจ้าของ':p.owner,'คงเหลือ':p.stock,'ขั้นต่ำ':p.min,'หน่วยนับ':p.unit,'รูปภาพ':p.image};
}
function mockApi(action, payload){
  return new Promise(resolve=>setTimeout(()=>resolve(_mockHandle(action, payload)), 150));
}
function _mockHandle(action, p){
  switch(action){
    case 'login': {
      const u = MOCK.users.find(x=>x.u===p.username && x.p===p.password);
      MOCK.logins.push({'วันที่-เวลา':new Date().toISOString(),'Username':p.username,'ชื่อ-นามสกุล':u?u.n:'-','แผนก':u?u.d:'-','ผลลัพธ์':u?'สำเร็จ':'ไม่สำเร็จ'});
      return u ? {ok:true, user:{user:u.u, name:u.n, dept:u.d}} : {ok:false, message:'Username หรือ Password ไม่ถูกต้อง'};
    }
    case 'getOwnersConfig':
      return {owners:['ME','MFG','PE'], labels:{ME:'ME – ซ่อมบำรุง', MFG:'MFG – ฝ่ายผลิต', PE:'PE – วิศวกรรมกระบวนการ'}};
    case 'getSpreadsheetInfo':
      return {name:'Master Spare Part List (Demo)', url:'https://docs.google.com/spreadsheets'};
    case 'getPartsList': return MOCK.parts.map(_partRow);
    case 'getHistory': return MOCK.history.slice();
    case 'getUsers': return MOCK.users.map(u=>({'Username':u.u,'ชื่อ-นามสกุล':u.n,'แผนก':u.d}));
    case 'getLoginRecords': return MOCK.logins.slice();
    case 'createUser':
      if(MOCK.users.some(x=>x.u===p.user)) return {ok:false, message:'มี Username นี้อยู่แล้ว'};
      MOCK.users.push({u:p.user, p:p.pass, n:p.name, d:p.dept}); return {ok:true};
    case 'addPart': {
      const _tk = c=>String(c).split(',').map(z=>z.trim().toLowerCase()).filter(Boolean);
      if(MOCK.parts.some(x=>_tk(x.code).some(k=>_tk(p.code).includes(k)))) return {ok:false, message:'มีรหัสอะไหล่นี้อยู่แล้ว'};
      MOCK.parts.push({code:p.code,name:p.name,category:p.category||'',owner:p.owner||'',stock:Number(p.stock)||0,min:Number(p.min)||0,unit:p.unit||'',
        image:p.imageBase64?('data:'+(p.imageMimeType||'image/jpeg')+';base64,'+p.imageBase64):''});
      return {ok:true};
    }
    case 'updatePart': {
      const x = MOCK.parts.find(y=>y.code===p.code);
      if(!x) return {ok:false, message:'ไม่พบอะไหล่รหัสนี้'};
      Object.assign(x,{name:p.name,category:p.category||'',owner:p.owner||'',min:Number(p.min)||0,unit:p.unit||''});
      if(p.imageBase64) x.image = 'data:'+(p.imageMimeType||'image/jpeg')+';base64,'+p.imageBase64;
      return {ok:true};
    }
    case 'recordTransaction': {
      const x = MOCK.parts.find(y=>y.code===p.code);
      if(!x) return {ok:false, message:'ไม่พบอะไหล่รหัสนี้'};
      const q = Number(p.qty)||0;
      if(p.type==='withdraw'){
        if(q > x.stock) return {ok:false, message:'จำนวนเบิกเกินสต็อกคงเหลือ (คงเหลือ '+x.stock+')'};
        x.stock -= q;
      } else if(p.type==='replenish'){ x.stock += q; }
      else return {ok:false, message:'ประเภทรายการไม่ถูกต้อง'};
      MOCK.history.push({'วันที่':new Date().toISOString(),'ประเภท':p.type==='withdraw'?'เบิกออก':(p.kind==='return'?'คืน':'เติมเข้า'),'รหัส':x.code,'ชื่ออะไหล่':x.name,'จำนวน':q,'โดย':p.person,'หมายเหตุ':p.note||''});
      return {ok:true, newStock:x.stock};
    }
    default: return {ok:false, message:'Unknown action: '+action};
  }
}

// ======== i18n ========
let lang = 'th';
try{ const saved = localStorage.getItem('spm_lang'); if(saved==='th'||saved==='en') lang = saved; }catch(e){}

const I18N = {
  th: {
    appTitle:'WG3 Plating Spare Part Management', loginSubtitle:'กรุณาเข้าสู่ระบบ',

const SERVER_MSG_MAP_EN = {
  'Username หรือ Password ไม่ถูกต้อง': 'Invalid username or password',
  'มีรหัสอะไหล่นี้อยู่แล้ว': 'This part code already exists',
  'ไม่พบอะไหล่รหัสนี้': 'Part code not found',

};
function translateServerMsg(msg){
  if(lang !== 'en' || !msg) return msg;
  if(SERVER_MSG_MAP_EN[msg]) return SERVER_MSG_MAP_EN[msg];
  const m = msg.match(/^จำนวนเบิกเกินสต็อกคงเหลือ \(คงเหลือ (.+)\)$/);
  if(m) return 'Requested quantity exceeds remaining stock (remaining ' + m[1] + ')';
  return msg;
}

// ย่อรูปที่อัปโหลดให้ไม่เกิน 128px เพื่อให้เก็บได้เล็กและโหลดเร็ว
function resizeImageToDataUrl(file, maxSize, cb, outType){
  const reader = new FileReader();
  reader.onload = ()=>{
    const img = new Image();
    img.onload = ()=>{
      const ratio = Math.min(1, maxSize/Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width*ratio));
      c.height = Math.max(1, Math.round(img.height*ratio));
      const ctx = c.getContext('2d');
      if(outType === 'image/jpeg'){ ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, c.width, c.height); } // JPEG ไม่มีความโปร่งใส
      ctx.drawImage(img, 0, 0, c.width, c.height);
      cb(c.toDataURL(outType || 'image/png', 0.85));
    };
    img.onerror = ()=>cb(null);
    img.src = reader.result;
  };
  reader.onerror = ()=>cb(null);
  reader.readAsDataURL(file);
}

function fmtDate(d){ return d.toLocaleString(lang==='th'?'th-TH':'en-US',{dateStyle:'short',timeStyle:'short'}); }
function partByCode(c){ return parts.find(p=>p.code===c); }

// ---- อะไหล่ที่มี 2 รหัส: เก็บเป็น "รหัสแรก,รหัสสอง" ในช่องเดียว ----
function splitCodes(code){ return String(code||'').split(',').map(x=>x.trim()).filter(Boolean); }
function escHTML(x){ return String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function codeHTML(code){ return splitCodes(code).map(escHTML).join('<br>'); }   // แสดงในตาราง: คนละบรรทัด
function codeLabel(code){ return splitCodes(code).join(' / '); }                // แสดงในข้อความ/Dropdown
function normalizeCodes(raw){
  const arr = splitCodes(raw);
  if(!arr.length) return {ok:false, error:t('codeEmpty')};
  if(arr.length > 2) return {ok:false, error:t('codeTooMany')};
  if(arr.length === 2 && arr[0].toLowerCase() === arr[1].toLowerCase()) return {ok:false, error:t('codeSame')};
  for(const tok of arr){
    const hit = parts.find(x=>splitCodes(x.code).some(c=>c.toLowerCase()===tok.toLowerCase()));
    if(hit) return {ok:false, error:t('codeExists')+tok};
  }
  return {ok:true, value:arr.join(',')};
}
function statusOf(p){ if(p.stock===0) return 'out'; if(p.stock<p.min) return 'low'; return 'ok'; }
function filteredParts(){
  return parts.filter(p=>{
    if(partFilter.search){
      const q = partFilter.search.toLowerCase();
      if(!p.code.toLowerCase().includes(q) && !p.name.toLowerCase().includes(q)) return false;
    }
    if(invCategory && (p.category||'') !== invCategory) return false;
    if(partFilter.owner && p.owner !== partFilter.owner) return false;
    if(partFilter.status && statusOf(p) !== partFilter.status) return false;
    return true;
  }).sort((a,b)=> (b.pinned?1:0) - (a.pinned?1:0));
}

// แปลงลิงก์ Google Drive ทุกรูปแบบ (รวมของเดิมที่เป็น uc?export=view) เป็นลิงก์ thumbnail ที่ฝังใน <img> ได้
function driveImgUrl(u){
  if(!u || String(u).indexOf('data:') === 0) return u || '';
  const m = String(u).match(/drive\.google\.com\/(?:uc\?[^#]*?id=|file\/d\/|open\?id=|thumbnail\?id=)([\w-]{10,})/)
         || String(u).match(/lh3\.googleusercontent\.com\/d\/([\w-]{10,})/);
  return m ? 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w800' : String(u);
}

// ---------- Charts (pure CSS/SVG, no libs) ----------
function statusChart(){
  const ok = parts.filter(p=>statusOf(p)==='ok').length;
  const low = parts.filter(p=>statusOf(p)==='low').length;
  const out = parts.filter(p=>statusOf(p)==='out').length;
  const totalReal = parts.length;
  const total = totalReal || 1;
  const pct = n => totalReal ? Math.round(n/totalReal*100) : 0;
  const pOk = ok/total*360, pLow = low/total*360;
  const c1 = pOk, c2 = pOk+pLow;
  const gradient = `conic-gradient(var(--ok) 0deg ${c1}deg, var(--warn) ${c1}deg ${c2}deg, var(--danger-dark) ${c2}deg 360deg)`;
  return `
  <div class="chart-row">
    <div class="donut" style="background:${gradient}"></div>
    <div class="legend">
      <div><span class="dot" style="background:var(--ok)"></span>${t('statusOk')} — ${ok} ${t('items')} (${pct(ok)}%)</div>
      <div><span class="dot" style="background:var(--warn)"></span>${t('statusLow')} — ${low} ${t('items')} (${pct(low)}%)</div>
      <div><span class="dot" style="background:var(--danger-dark)"></span>${t('statusOut')} — ${out} ${t('items')} (${pct(out)}%)</div>
      <div style="color:var(--muted)">${t('totalAll')} ${totalReal} ${t('items')}</div>
    </div>
  </div>`;
}

function periodCutoff(){
  const d = new Date();
  d.setDate(d.getDate() - (reportPeriod==='week' ? 7 : 30));
  return d;
}
function aggregateTx(type){
  const cutoff = periodCutoff();
  const map = {};
  tx.filter(tr=>tr.type===type && tr.date>=cutoff).forEach(tr=>{
    if(!map[tr.code]) map[tr.code] = {code:tr.code, name:tr.name, qty:0};
    map[tr.code].qty += tr.qty;
  });
  return Object.values(map).sort((a,b)=>b.qty-a.qty).slice(0,5);
}
function rankBars(list, color){
  if(!list.length) return `<div class="empty">${t('noDataPeriod')}</div>`;
  const max = Math.max(...list.map(i=>i.qty));
  return list.map(i=>`<div class="bar-item">
    <div class="bh"><span>${codeLabel(i.code)} — ${i.name}</span><span>${i.qty} ${t('units')}</span></div>
    <div class="bar-track"><div class="bar-fill" style="width:${(i.qty/max*100)}%;background:${color}"></div></div>
  </div>`).join('');
}

function csvEscape(v){
  const s = String(v==null?'':v);
  return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
}
function downloadText(filename, text){
  const blob = new Blob([text], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
function partsToCSV(){
  const rows = [t('csvParts')];
  parts.forEach(p=>rows.push([p.code,p.name,p.category||'',p.owner||'',p.stock,p.min,p.unit,
    statusOf(p)==='out'?t('statusOutShort'):statusOf(p)==='low'?t('statusLow'):t('statusOk')]));
  return rows.map(r=>r.map(csvEscape).join(',')).join('\n');
}
function txToCSV(){
  const rows = [t('csvHistory')];
  tx.forEach(tr=>rows.push([tr.date.toISOString(),typeLabel(tr),tr.code,tr.name,tr.qty,tr.person,tr.note||'']));
  return rows.map(r=>r.map(csvEscape).join(',')).join('\n');
}

function fileToBase64(file, cb){
  const sendOriginal = ()=>{
    const reader = new FileReader();
    reader.onload = ()=>{ cb(reader.result.split(',')[1], file.type); };
    reader.readAsDataURL(file);
  };
  try{
    // ย่อรูปเหลือไม่เกิน 800px แบบ JPEG ก่อนส่ง (ลดขนาดข้อมูล/เวลาอัปโหลด) ถ้าย่อไม่ได้ส่งไฟล์เดิม
    resizeImageToDataUrl(file, 800, dataUrl=>{
      if(dataUrl && dataUrl.indexOf('data:image/jpeg') === 0) cb(dataUrl.split(',')[1], 'image/jpeg');
      else sendOriginal();
    }, 'image/jpeg');
  }catch(e){ sendOriginal(); }
}

      });

  const editCatFilter = document.getElementById('editCatFilter');
  const editOwnerFilter = document.getElementById('editOwnerFilter');
  const refreshEditPicker = ()=>{
    document.getElementById('editPartSelect').innerHTML = editSelectOptions(editPartSearchBox.value, editCatFilter.value, editOwnerFilter.value);
    document.getElementById('editPartFields').classList.add('hidden');
    editingCode = null;
  };
  if(editPartSearchBox) editPartSearchBox.oninput = refreshEditPicker;
  if(editCatFilter) editCatFilter.onchange = refreshEditPicker;
  if(editOwnerFilter) editOwnerFilter.onchange = refreshEditPicker;

  if(editPartForm){
    editPartForm.onsubmit = e=>{
      e.preventDefault();
      if(!editingCode){ showMsg('editPartMsg', t('selectPartFirst'), false); return; }
      const f = new FormData(editPartForm);
      const part = {code:editingCode, name:f.get('name').trim(), category:f.get('category').trim(),
        unit:f.get('unit').trim(), min:f.get('min'), owner:f.get('owner')};
      const submit = ()=>{
        callApi('updatePart', part).then(res=>{
          if(!res.ok){ showMsg('editPartMsg', translateServerMsg(res.message), false); return; }
          closeEditModal();
          refreshAllData();
        }).catch(err=>{
          showMsg('editPartMsg', t('errorPrefix')+err.message, false);
        });
      };
      const file = f.get('image');
      if(file && file.size > 0){
        fileToBase64(file, (base64, mime)=>{ part.imageBase64 = base64; part.imageMimeType = mime; submit(); });
      } else submit();
    };
  }
  const editCloseBtn = document.getElementById('editCloseBtn');

  const editCancelBtn = document.getElementById('editCancelBtn');
  if(editCancelBtn) editCancelBtn.onclick = closeEditModal;

  // --- Inventory sub-tabs (category) ---
  const invSubtabs = document.getElementById('invSubtabs');

    invSubtabs.onclick = e=>{
      const b = e.target.closest('.subtab');

    };
  }

  // --- logo upload (Settings) ---
  const logoFileInput = document.getElementById('logoFileInput');
  if(logoFileInput){
    logoFileInput.onchange = ()=>{
      const file = logoFileInput.files[0];
      if(!file) return;
      resizeImageToDataUrl(file, 128, url=>{
        if(!url){ showMsg('logoMsg', t('logoFail'), false); return; }
        setBrandLogo(url);
        document.getElementById('logoPreview').innerHTML = brandIconHTML();
        showMsg('logoMsg', t('logoSaved'), true);
        logoFileInput.value = '';
      });
    };
  }
  const logoRemoveBtn = document.getElementById('logoRemoveBtn');
  if(logoRemoveBtn){
    logoRemoveBtn.onclick = ()=>{
      setBrandLogo('');
      document.getElementById('logoPreview').innerHTML = brandIconHTML();
      showMsg('logoMsg', t('logoSaved'), true);
    };
  }

  // --- toggle Safety Stock column ---
  const partsTableWrap = document.getElementById('partsTableWrap');
  if(partsTableWrap){
    partsTableWrap.onclick = e=>{
      if(e.target.closest('#toggleSafetyBtn')){ showSafety = !showSafety; render(); return; }
      if(e.target.closest('.pin-btn')) return; // ปุ่มปักหมุดมีการทำงานของตัวเอง
      const row = e.target.closest('tr.part-row');
      if(row) openPartDetail(row.dataset.code);
    };
  }

  // --- part filter (client-side on already-fetched data) ---
  const partFilterForm = document.getElementById('partFilterForm');
  if(partFilterForm){
    const refresh = ()=>{
      const f = new FormData(partFilterForm);
      partFilter = {search:f.get('search')||'', category:f.get('category')||'', owner:f.get('owner')||'', status:f.get('status')||''};
      document.getElementById('partsCount').textContent = `${t('partsInStock')} (${filteredParts().length}/${parts.length})`;
      document.getElementById('partsTableWrap').innerHTML = partsTableHTML(filteredParts());
      document.querySelectorAll('.pin-btn').forEach(b=>{
        b.onclick = ()=>{
          const p = partByCode(b.dataset.pin);
          if(p) p.pinned = !p.pinned;
          render();
        };
      });
    };
    partFilterForm.querySelectorAll('input').forEach(el=>el.oninput = refresh);
    partFilterForm.querySelectorAll('select').forEach(el=>el.onchange = refresh);
  }

  // --- add part (modal) ---
  const openAddPartBtn = document.getElementById('openAddPartBtn');
  if(openAddPartBtn) openAddPartBtn.onclick = openAddModal;
  const addCancelBtn = document.getElementById('addCancelBtn');
  if(addCancelBtn) addCancelBtn.onclick = closeAddModal;
  const addPartForm = document.getElementById('addPartForm');
  if(addPartForm){
    addPartForm.onsubmit = e=>{
      e.preventDefault();
      const f = new FormData(addPartForm);
      const norm = normalizeCodes(f.get('code'));
      if(!norm.ok){ showMsg('addPartMsg', norm.error, false); return; }
      const part = {code:norm.value, name:f.get('name').trim(), category:f.get('category').trim(),
        unit:f.get('unit').trim(), stock:f.get('stock'), min:f.get('min'), owner:f.get('owner')};
      const submit = ()=>{
        callApi('addPart', part).then(res=>{
          if(!res.ok){ showMsg('addPartMsg', translateServerMsg(res.message), false); return; }
          closeAddModal();
          refreshAllData();
        }).catch(err=>{
          showMsg('addPartMsg', t('errorPrefix')+err.message, false);
        });
      };
      const file = f.get('image');
      if(file && file.size > 0){
        fileToBase64(file, (base64, mime)=>{ part.imageBase64 = base64; part.imageMimeType = mime; submit(); });
      } else submit();
    };
  }

  // --- withdraw ---
  const withdrawForm = document.getElementById('withdrawForm');
  if(withdrawForm){
    withdrawForm.onsubmit = e=>{
      e.preventDefault();
      const f = new FormData(withdrawForm);
      const code = f.get('code');
      if(!code){ showMsg('withdrawMsg', t('pleaseSelectPart'), false); return; }
      const txn = {type:'withdraw', code, qty:f.get('qty'), person:f.get('person'), note:f.get('note')};
      callApi('recordTransaction', txn).then(res=>{
        if(!res.ok){ showMsg('withdrawMsg', translateServerMsg(res.message), false); return; }
        showMsg('withdrawMsg', `${t('withdrawSuccess')}${res.newStock}`, true);
        withdrawForm.reset();
        refreshAllData();
      }).catch(err=>{
        showMsg('withdrawMsg', t('errorPrefix')+err.message, false);
      });
    };
  }

  // --- replenish ---
  const replenishForm = document.getElementById('replenishForm');
  if(replenishForm){
    replenishForm.onsubmit = e=>{
      e.preventDefault();
      const f = new FormData(replenishForm);
      const code = f.get('code');
      if(!code){ showMsg('replenishMsg', t('pleaseSelectPart'), false); return; }
      const txn = {type:'replenish', kind:f.get('kind')||'add', code, qty:f.get('qty'), person:f.get('person'), note:f.get('note')};
      callApi('recordTransaction', txn).then(res=>{
        if(!res.ok){ showMsg('replenishMsg', translateServerMsg(res.message), false); return; }
        showMsg('replenishMsg', `${t('replenishSuccess')}${res.newStock}`, true);
        replenishForm.reset();
        refreshAllData();
      }).catch(err=>{
        showMsg('replenishMsg', t('errorPrefix')+err.message, false);
      });
    };
  }
}

// ---------- Boot ----------
if(API_URL.indexOf('PASTE_YOUR') === 0){
  document.getElementById('app').innerHTML = `<div class="login-wrap"><div class="login-card"><h1>${t('apiNotSetTitle')}</h1><p>${t('apiNotSetDesc')}</p></div></div>`;
} else if(currentUser){ bootApp(); } else { renderLogin(); }
</script>
</body>
</html>
